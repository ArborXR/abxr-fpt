name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The declared minimum, and the newest Python the dependencies have been checked on. Pinned rather than "3.x",
        # so a new Python release can't turn every PR red before the dependencies support it.
        python-version: ["3.9", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # A regular install, not editable: it builds the package, so a module or dependency the package leaves out
      # fails the check below.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run the unit tests
        run: python -m unittest discover -s tests -v

      # From outside the checkout, so the installed package is what gets imported, not the source tree.
      - name: Check the command-line tools load
        working-directory: ${{ runner.temp }}
        run: |
          abxr-provision --help
          abxr-display-setup-mode
