name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared minimum, and the latest Python 3.
        python-version: ["3.9", "3.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install the package the way an operator does, so packaging problems (like a missing runtime dependency)
      # fail here too.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run the unit tests
        run: python -m unittest discover -s tests -v

      - name: Check the tool starts
        run: abxr-provision --help
